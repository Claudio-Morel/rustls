[package]
name = "kemtls-handshake-bench"
version = "0.1.0"
edition = "2021"

# Standalone workspace: this crate is an addition to the KEMTLS rustls fork
# (not a member of the top-level rustls/rustls-mio workspace), so it keeps
# its own target/ output and lockfile.
[workspace]

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[dependencies]
rustls = { path = "../rustls", features = ["dangerous_configuration", "logging"] }
webpki = "0.21.0"
env_logger = "0.9"
log = "0.4"

# This crate has its own [workspace] above, so it does not inherit the
# top-level rustls/Cargo.toml patches. Mirror them here (as local paths,
# matching the submodules already vendored under kemtls-experiment/).
[patch.crates-io]
webpki = { path = "../../webpki" }
ring = { path = "../../ring" }
